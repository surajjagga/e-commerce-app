<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Thank You!</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #28a745; border-bottom: 2px solid #28a745; padding-bottom: 10px; margin-bottom: 20px; }
        .success-message { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 5px; font-size: 1.1em; }

    </style>
</head>
<body>

<div class="container">

    <h1>Payment Successful!</h1>

    <div class="success-message">
        <p>🎉 **Thank you for your order, <span th:text="${customerName}"></span>!**</p>
        <p>Your payment of <span th:text="${totalAmount}"></span> was successfully processed, and your order is confirmed.</p>
        <p>Order reference <span th:text="${orderReference}"></span></p>
    </div>




</div>

</body>
</html>
